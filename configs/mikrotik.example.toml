# Copy to .local/mikrotik.toml and edit for your devices.
# Relative paths resolve beside this file; ~/ expands to your home directory.
# Omit groups to expose the complete catalog. Profile groups further restrict calls.
groups = ["system", "interface", "bridge", "vlan", "address", "route", "firewall", "dhcp", "dns", "log"]

[server]
transport = "stdio" # Select "http", or use --transport http at startup.

[server.http]
listen = "127.0.0.1:8081"
token_env = "MIKROTIK_MCP_HTTP_TOKEN"
max_request_bytes = 16777216
# A nonempty token takes precedence over token_env. Set a random bearer token
# of 32..4096 ASCII token characters at HTTP startup; --check needs no secrets.
# token = ""
# Hostnames/IPs without ports. A loopback bind defaults to loopback names.
# allowed_hosts = ["mcp.example.com"]
# Browser clients need exact origins; clients without Origin need no entry.
# allowed_origins = ["https://client.example.com", "https://mcp.example.com"]
# Listeners outside loopback require both TLS files. Wildcard listeners also
# require explicit allowed_hosts; a proxy preserving a public Host needs it listed.
# tls_cert_file = "certs/mikrotik-server.pem"
# tls_key_file = "certs/mikrotik-server-key.pem"

[profiles.headquarters]
host = "192.0.2.10"
port = 443
username = "mcp"
password_env = "MIKROTIK_HQ_PASSWORD"
# ca_file = "certs/mikrotik-ca.pem" # Omit to use the system trust store.
read_only = true
timeout_seconds = 30
max_output_bytes = 4194304

[profiles.branch]
host = "192.0.2.20"
username = "mcp"
password_env = "MIKROTIK_BRANCH_PASSWORD"
# ca_file = "certs/mikrotik-ca.pem" # Omit to use the system trust store.
read_only = true
groups = ["system", "interface", "route", "log"]
